server:
  port:
    8080

spring:
  application:
    name: cms-api-gateway
  main:
    web-application-type: reactive
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${app.services.auth.base-url}/oauth2/jwks

app:
  services:
    auth:
      base-url: http://localhost:9091
    company-info:
      base-url: http://localhost:3000
